name: CI
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      # GitHub's runner already has PostgreSQL installed, so nothing is
      # downloaded (Docker Hub and AWS's mirror both rate-limit image pulls).
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do pg_isready -h localhost && break; sleep 1; done
          sudo -u postgres psql -c "alter user postgres password 'postgres';"
          psql -c "select version();"
      - run: bash scripts/test-db.sh
